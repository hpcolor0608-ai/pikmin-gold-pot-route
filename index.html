<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Pikmin Bloom 巡禮地圖｜CoCo 主線＋沿途全家</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg-dark: #0f172a;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #475569;
    --coco: #ea580c;
    --fma: #16a34a;
    --fmb: #2563eb;
    --done: #64748b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Noto Sans TC", sans-serif; background: #f8fafc; }
  body { display: flex; flex-direction: column; }

  header {
    background: var(--bg-dark);
    color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px 12px;
    z-index: 1000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .top-row h1 { margin: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats-pill {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    white-space: nowrap;
  }
  .filter-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    -webkit-overflow-scrolling: touch;
  }
  .filter-btn {
    min-height: 44px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #cbd5e1;
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }
  .filter-btn.active { background: #334155; color: #fff; border-color: #94a3b8; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  .banner {
    display: none;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.4;
    z-index: 999;
  }
  .banner.warn { background: #fef3c7; color: #92400e; border-bottom: 1px solid #fcd34d; }
  .banner.err { background: #fee2e2; color: #991b1b; border-bottom: 1px solid #fca5a5; }

  #map { flex: 1; width: 100%; position: relative; background: #f8fafc; }

  .coco-num {
    background: var(--coco); color: #fff; border: 2px solid #fff; border-radius: 50%;
    width: 26px; height: 26px; line-height: 22px; text-align: center; font-weight: 700; font-size: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.45);
  }
  .coco-num.collected { background: var(--done); opacity: 0.65; }
  .start-num {
    background: #dc2626; color: #fff; border: 2px solid #fff; border-radius: 6px;
    padding: 2px 6px; font-weight: 700; font-size: 11px; white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,0.45);
  }

  /* Popup buttons sized for iPhone touch */
  .popup-box { min-width: 220px; max-width: 260px; font-size: 13px; line-height: 1.45; color: var(--text-main); }
  .popup-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  .popup-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .popup-addr { font-size: 12px; margin-bottom: 6px; }
  .popup-note { font-size: 11px; color: #b45309; background: #fffbeb; padding: 4px 6px; border-radius: 6px; margin-bottom: 8px; }
  .btn-stack { display: flex; flex-direction: column; gap: 6px; }
  .btn-touch {
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    width: 100%;
  }
  .btn-collect { background: #e2e8f0; color: #0f172a; }
  .btn-collect.is-done { background: #16a34a; color: #fff; }
  .btn-gmaps { background: #2563eb; color: #fff !important; }
  .btn-apple { background: #0f172a; color: #fff !important; }
  .nav-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  /* Segmented Route Modal */
  #segModal {
    display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.65); z-index: 2000;
    align-items: flex-end; justify-content: center;
  }
  #segModal.open { display: flex; }
  .modal-sheet {
    background: #fff; width: 100%; max-width: 520px; border-radius: 18px 18px 0 0;
    padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 18px) 16px;
    max-height: 82dvh; overflow-y: auto;
  }
  .modal-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .modal-hdr h2 { margin: 0; font-size: 16px; }
  .seg-card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
  .seg-card strong { display: block; font-size: 14px; margin-bottom: 4px; }
  .seg-card span { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
</style>
</head>

<div id="map"></div>

</div>

  COCO_DATA.forEach(c => { if (c.seq > 0 && collectedMap[storeId('C', c.name)]) doneCoCo++; });
  FM_DATA.forEach(f => { if (collectedMap[storeId('F', f.name)]) doneFM++; });
  document.getElementById('statsPill').textContent = `已採 ${doneCoCo + doneFM} / 93 (CoCo ${doneCoCo}/19)`;
}
updateStats();

// Populate Segmented Modal
const segListEl = document.getElementById('segList');
SEG_LINKS.forEach(s => {
  const div = document.createElement('div');
  div.className = 'seg-card';
  div.innerHTML = `<strong>${s.seg}（${s.count} 站）</strong><span>${s.start} → ${s.end}</span><a class="btn-touch btn-gmaps" href="${s.url}" target="_blank" rel="noopener">開啟 Google Maps 分段導航</a>`;
  segListEl.appendChild(div);
});
document.getElementById('btnSegs').onclick = () => document.getElementById('segModal').classList.add('open');
document.getElementById('btnCloseModal').onclick = () => document.getElementById('segModal').classList.remove('open');
document.getElementById('segModal').onclick = e => { if (e.target.id === 'segModal') e.target.classList.remove('open'); };

function appleUrl(lat, lon, name) {
  return `https://maps.apple.com/?daddr=${lat},${lon}&q=${encodeURIComponent(name)}`;
}
function gmapsNavUrl(lat, lon) {
  return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=two-wheeler`;
}

function makePopupEl(id, isCollectable, title, subtitle, addr, extra, lat, lon, onToggle) {
  const wrap = document.createElement('div');
  wrap.className = 'popup-box';
  const isDone = !!collectedMap[id];
  wrap.innerHTML = `
    <div class="popup-title">${title}</div>
    <div class="popup-sub">${subtitle}</div>
    <div class="popup-addr">📍 ${addr}</div>
    ${extra ? `<div style="font-size:12px;color:#0f766e;margin-bottom:6px">${extra}</div>` : ''}
    <div class="popup-note">⚠️ 活動資格待確認（請於 Pikmin Bloom v156+ 核對特殊地點）</div>
    <div class="btn-stack">
      ${isCollectable ? `<button type="button" class="btn-touch btn-collect ${isDone ? 'is-done' : ''}">${isDone ? '✅ 已採集（點擊改回未採集）' : '⬜ 標記為已採集'}</button>` : ''}
      <a class="btn-touch btn-gmaps" href="${gmapsNavUrl(lat, lon)}" target="_blank" rel="noopener">Google Maps 導航</a>
      <a class="btn-touch btn-apple" href="${appleUrl(lat, lon, title)}" target="_blank" rel="noopener">Apple Maps 地點導航</a>
    </div>
    <div class="nav-hint">Google Maps 請於 App 內確認為「機車」模式；Apple Maps 僅供地點與一般路徑參考，不保證台灣機車專用路線。</div>
  `;
  if (isCollectable) {
    const btn = wrap.querySelector('.btn-collect');
    btn.onclick = () => {
      if (collectedMap[id]) delete collectedMap[id];
      else collectedMap[id] = true;
      saveCollected();
      const nowDone = !!collectedMap[id];
      btn.className = 'btn-touch btn-collect ' + (nowDone ? 'is-done' : '');
      btn.textContent = nowDone ? '✅ 已採集（點擊改回未採集）' : '⬜ 標記為已採集';
      updateStats();
      onToggle(nowDone);
    };
  }
  return wrap;
}

if (typeof L !== 'undefined') {
  const map = L.map('map', { tap: true }).setView([24.925, 121.235], 13);

  const nlscTiles = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', {
    attribution: '&copy; 內政部國土測繪中心 (NLSC)',
    maxZoom: 19
  });
  const cartoTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 19
  });

  let tileErrCount = 0;
  let switchedToCarto = false;
  nlscTiles.addTo(map);

  function attachTileGuard(layer) {
    layer.on('tileerror', () => {
      tileErrCount += 1;
      if (tileErrCount >= 3) {
        if (!switchedToCarto && map.hasLayer(nlscTiles)) {
          map.removeLayer(nlscTiles);
          switchedToCarto = true;
          tileErrCount = 0;
          cartoTiles.addTo(map);
        } else {
          if (map.hasLayer(layer)) map.removeLayer(layer);
          document.getElementById('tileBanner').style.display = 'block';
        }
      }
    });
  }
  attachTileGuard(nlscTiles);
  attachTileGuard(cartoTiles);

  L.control.layers({
    '臺灣通用電子地圖 (NLSC)': nlscTiles,
    'CARTO Voyager': cartoTiles
  }, null, { position: 'bottomright' }).addTo(map);

  const cocoLayer = L.layerGroup().addTo(map);
  const layerA = L.layerGroup().addTo(map);
  const layerB = L.layerGroup().addTo(map);

  L.polyline(ROUTE_POLY, { color: '#ea580c', weight: 4, opacity: 0.85 }).addTo(cocoLayer);

  let showCoCo = true, showA = true, showB = true, hideDone = false;
  const cocoMarkers = [];
  const fmMarkers = [];

  function makeCocoIcon(seq, done) {
    return L.divIcon({
      className: '',
      html: seq === 0 ? `<div class="start-num">起終點</div>` : `<div class="coco-num ${done ? 'collected' : ''}">${seq}</div>`,
      iconSize: seq === 0 ? [48, 22] : [26, 26],
      iconAnchor: seq === 0 ? [24, 11] : [13, 13]
    });
  }

  COCO_DATA.forEach(c => {
    const id = storeId('C', c.name);
    const done = !!collectedMap[id];
    const m = L.marker([c.lat, c.lon], { icon: makeCocoIcon(c.seq, done) });
    const sub = c.seq === 0 ? '平南國中（起點／終點）' : `CoCo 主線第 ${c.seq} 站`;
    m.bindPopup(() => makePopupEl(id, c.seq > 0, c.name, sub, c.addr, '', c.lat, c.lon, (nowDone) => {
      m.setIcon(makeCocoIcon(c.seq, nowDone));
      refreshVisibility();
    }));
    cocoMarkers.push({ id, seq: c.seq, marker: m });
  });

  FM_DATA.forEach(f => {
    const id = storeId('F', f.name);
    const isA = f.tier === 'A';
    const done = !!collectedMap[id];
    const m = L.circleMarker([f.lat, f.lon], {
      radius: isA ? 8 : 7,
      color: '#fff',
      weight: 2,
      fillColor: done ? '#64748b' : (isA ? '#16a34a' : '#2563eb'),
      fillOpacity: done ? 0.55 : 0.92
    });
    m.bindPopup(() => makePopupEl(
      id, true, f.name, `全家 ${f.tier} 級｜區段：${f.seg}`, f.addr,
      `預估額外騎乘：+${f.extra} 分鐘（另加停靠 4 分）`, f.lat, f.lon,
      (nowDone) => {
        m.setStyle({
          fillColor: nowDone ? '#64748b' : (isA ? '#16a34a' : '#2563eb'),
          fillOpacity: nowDone ? 0.55 : 0.92
        });
        refreshVisibility();
      }
    ));
    fmMarkers.push({ id, tier: f.tier, marker: m });
  });

  function refreshVisibility() {
    cocoMarkers.forEach(item => {
      const visible = showCoCo && (!hideDone || item.seq === 0 || !collectedMap[item.id]);
      if (visible && !cocoLayer.hasLayer(item.marker)) cocoLayer.addLayer(item.marker);
      if (!visible && cocoLayer.hasLayer(item.marker)) cocoLayer.removeLayer(item.marker);
    });
    fmMarkers.forEach(item => {
      const grp = item.tier === 'A' ? layerA : layerB;
      const on = item.tier === 'A' ? showA : showB;
      const visible = on && (!hideDone || !collectedMap[item.id]);
      if (visible && !grp.hasLayer(item.marker)) grp.addLayer(item.marker);
      if (!visible && grp.hasLayer(item.marker)) grp.removeLayer(item.marker);
    });
  }
  refreshVisibility();

  document.getElementById('btnCoCo').onclick = function() {
    showCoCo = !showCoCo; this.classList.toggle('active', showCoCo); refreshVisibility();
  };
  document.getElementById('btnA').onclick = function() {
    showA = !showA; this.classList.toggle('active', showA); refreshVisibility();
  };
  document.getElementById('btnB').onclick = function() {
    showB = !showB; this.classList.toggle('active', showB); refreshVisibility();
  };
  document.getElementById('btnHideDone').onclick = function() {
    hideDone = !hideDone; this.classList.toggle('active', hideDone); refreshVisibility();
  };
} else {
  document.getElementById('tileBanner').style.display = 'block';
  const container = document.getElementById('map');
  const lats = ROUTE_POLY.map(p => p[0]), lons = ROUTE_POLY.map(p => p[1]);
  const minLat = Math.min(...lats) - 0.008, maxLat = Math.max(...lats) + 0.008;
  const minLon = Math.min(...lons) - 0.01, maxLon = Math.max(...lons) + 0.01;
  const W = 1000, H = 700;
  const x = lon => ((lon - minLon) / (maxLon - minLon)) * W;
  const y = lat => H - ((lat - minLat) / (maxLat - minLat)) * H;
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;background:#f8fafc">`;
  svg += `<polyline fill="none" stroke="#ea580c" stroke-width="3" points="${ROUTE_POLY.map(p => `${x(p[1]).toFixed(1)},${y(p[0]).toFixed(1)}`).join(' ')}" />`;
  FM_DATA.forEach(f => {
    svg += `<a href="${gmapsNavUrl(f.lat, f.lon)}" target="_blank"><circle cx="${x(f.lon).toFixed(1)}" cy="${y(f.lat).toFixed(1)}" r="6" fill="${f.tier==='A'?'#16a34a':'#2563eb'}" stroke="#fff" stroke-width="1.5"><title>${f.name} (${f.tier}級)</title></circle></a>`;
  });
  COCO_DATA.forEach(c => {
    svg += `<a href="${gmapsNavUrl(c.lat, c.lon)}" target="_blank"><circle cx="${x(c.lon).toFixed(1)}" cy="${y(c.lat).toFixed(1)}" r="11" fill="${c.seq===0?'#dc2626':'#ea580c'}" stroke="#fff" stroke-width="1.5"><title>${c.seq}. ${c.name}</title></circle><text x="${x(c.lon).toFixed(1)}" y="${(y(c.lat)+4).toFixed(1)}" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">${c.seq===0?'起':c.seq}</text></a>`;
  });
  svg += `</svg>`;
  container.innerHTML = svg;
}
</script>
</body>
</html>
